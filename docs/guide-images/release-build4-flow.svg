    <g font-size="34" font-weight="600"><text x="96" y="180">Versioned source</text><text x="901" y="180">Browser editor bundle</text><text x="96" y="450">Two Windows applications</text><text x="901" y="450">Package Studio Pro installers</text></g>
    <g font-size="27"><text x="96" y="230">Delphi project options · Pascal and DFM forms</text><text x="901" y="230">TypeScript check · Vite build · local editor files</text><text x="96" y="500">Win32 and Win64 · file version 1.0.0.4</text><text x="901" y="500">Application · loader · editor · guides · notices</text></g>
    <g font-size="27"><text x="60" y="640">WebView2 is checked before installation. SFTP uses the Windows OpenSSH Client.</text><text x="60" y="700">Saved projects, local drafts and credentials stay outside the installer payload.</text></g>
